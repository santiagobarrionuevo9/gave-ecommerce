<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h4 class="mb-0">
      Usuarios y acceso a precios
      <span class="badge text-bg-warning ms-2" *ngIf="pendingCount() > 0">
        {{ pendingCount() }} pendientes
      </span>
    </h4>
    <button class="btn btn-outline-secondary btn-sm" (click)="load()">Actualizar</button>
  </div>

  <div class="card shadow-sm mb-3">
    <div class="card-body d-flex gap-2 flex-wrap align-items-center">
      <input type="text" class="form-control" style="max-width:320px"
             placeholder="Buscar por email o nombre…"
             [ngModel]="search()" (ngModelChange)="search.set($event)">

      <div class="btn-group" role="group">
        <button type="button" class="btn btn-sm"
                [ngClass]="filter()==='pending' ? 'btn-primary' : 'btn-outline-primary'"
                (click)="setFilter('pending')">Pendientes</button>
        <button type="button" class="btn btn-sm"
                [ngClass]="filter()==='approved' ? 'btn-primary' : 'btn-outline-primary'"
                (click)="setFilter('approved')">Aprobados</button>
        <button type="button" class="btn btn-sm"
                [ngClass]="filter()==='all' ? 'btn-primary' : 'btn-outline-primary'"
                (click)="setFilter('all')">Todos</button>
      </div>
    </div>
  </div>

  <div *ngIf="loading()" class="alert alert-info">Cargando usuarios…</div>
  <div *ngIf="error()" class="alert alert-danger">{{ error() }}</div>

  <div class="table-responsive" *ngIf="!loading()">
    <table class="table table-hover align-middle bg-white shadow-sm">
      <thead class="table-light">
        <tr>
          <th>Nombre</th>
          <th>Email</th>
          <th>Estado</th>
          <th class="text-end">Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of filtered()">
          <td>{{ u.fullName || '—' }}</td>
          <td>{{ u.email }}</td>
          <td>
            <span class="badge" [ngClass]="u.priceAccess ? 'text-bg-success' : 'text-bg-secondary'">
              {{ u.priceAccess ? 'Ve precios' : 'Sin acceso' }}
            </span>
          </td>
          <td class="text-end">
            <button class="btn btn-sm"
                    [ngClass]="u.priceAccess ? 'btn-outline-danger' : 'btn-success'"
                    [disabled]="savingId() === u.id"
                    (click)="toggle(u)">
              {{ u.priceAccess ? 'Quitar acceso' : 'Aprobar' }}
            </button>
          </td>
        </tr>
        <tr *ngIf="filtered().length === 0">
          <td colspan="4" class="text-center text-muted py-4">No hay usuarios en esta vista.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
